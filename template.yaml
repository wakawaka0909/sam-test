AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Full Serverless ZIP Split Pipeline with Simulation

Resources:
  # --- 1. S3 集信バケット ---
  ZipSourceBucket:
    Type: AWS::S3::Bucket
    DependsOn: ZipSplitQueuePolicy
    Properties:
      BucketName: test-20260105
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "input/"
            Queue: !GetAtt ZipSplitQueue.Arn

  # --- 2. S3 分割ファイル保存バケット ---
  SplitBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: test-split-20260105

  # --- 3. S3 不良ファイル保存バケット ---
  ErrorBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: test-error-20260107

  # --- 3. SQS Queue & Policy ---
  ZipSplitQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-queue"
      VisibilityTimeout: 900

  ZipSplitQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ZipSplitQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: "s3.amazonaws.com" }
            Action: "sqs:SendMessage"
            Resource: !GetAtt ZipSplitQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"

  # --- 4. Dispatcher Lambda ---
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-dispatcher"
      CodeUri: lambda/dispatcher/
      Handler: dispatcher.lambda_handler
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ZipSplitStateMachine
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ZipSplitStateMachine.Name
      Events:
        MySQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ZipSplitQueue.Arn
            BatchSize: 10

  # --- 5. Split Lambda (Worker) ---
  SplitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-split"
      CodeUri: lambda/split/
      Handler: split.lambda_handler
      Runtime: python3.12
      MemorySize: 8192
      Timeout: 900
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ZipSourceBucket
        - S3WritePolicy:
            BucketName: !Ref SplitBucket

  # --- 6. Simulation Lambda (Random Test) ---
  SimulationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-simulation"
      # インラインで作成（テスト用）
      InlineCode: |
        import random
        def lambda_handler(event, context):
            file_path = event.get('file_path', 'unknown')
            src_path = event.get('src_path', 'unknown')
            table_name = evnet.get('table_name', 'unknown')
            if random.random() < 0.5:
                raise Exception(f"Random Failure: {file_path}")
            return {"status": "SUCCESS", "file_path": file_path, "src_path": src_path, "table_name": table_name}
      Handler: index.lambda_handler
      Runtime: python3.12
      Timeout: 10
    
  # --- 6. End Lambda ---
  EndFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-End"
      CodeUri: lambda/end/
      Handler: end.lambda_handler
      Runtime: python3.12
      Timeout: 900
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ZipSourceBucket
        - S3CrudPolicy:
            BucketName: !Ref SplitBucket
        - S3WritePolicy:
            BucketName: !Ref ErrorBucket

  # --- 7. Step Functions ---
  ZipSplitStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-statemachine"
      DefinitionUri: statemachine/state.json
      DefinitionSubstitutions:
        SplitLambdaArn: !GetAtt SplitFunction.Arn
        SimulationLambdaArn: !GetAtt SimulationFunction.Arn
        EndLambdaArn: !GetAtt EndFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SplitFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SimulationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref EndFunction
        - Statement:
            - Effect: Allow
              Action:
                - "states:StartExecution"
                - "states:DescribeExecution"
                - "states:StopExecution"
                - "states:RedriveExecution"
              Resource: 
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-statemachine"